<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60">
  <defs>
    <linearGradient id="dividerGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#52b788;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#40916c;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#2d6a4f;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#40916c;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#52b788;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Main line -->
  <line x1="0" y1="30" x2="400" y2="30" stroke="url(#dividerGradient)" stroke-width="1.5"/>
  
  <!-- Center flower ornament -->
  <circle cx="200" cy="30" r="12" fill="none" stroke="#40916c" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="30" r="8" fill="url(#dividerGradient)" opacity="0.3"/>
  
  <!-- Small leaves on sides -->
  <path d="M165 30 Q155 25 145 30 Q155 35 165 30" fill="#40916c" opacity="0.2"/>
  <path d="M235 30 Q245 25 255 30 Q245 35 235 30" fill="#40916c" opacity="0.2"/>
  
  <!-- Dots -->
  <circle cx="120" cy="30" r="2" fill="#52b788" opacity="0.4"/>
  <circle cx="140" cy="30" r="2" fill="#52b788" opacity="0.4"/>
  <circle cx="260" cy="30" r="2" fill="#52b788" opacity="0.4"/>
  <circle cx="280" cy="30" r="2" fill="#52b788" opacity="0.4"/>
</svg>