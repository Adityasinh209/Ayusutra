<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="petalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52b788;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2d6a4f;stop-opacity:0.15" />
    </linearGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef9e7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  
  <!-- Outer petals (8) -->
  <g transform="translate(90,90)">
    <path d="M0 -60 Q15 -40 0 -20 Q-15 -40 0 -60" fill="url(#petalGradient)" transform="rotate(0)"/>
    <path d="M0 -60 Q15 -40 0 -20 Q-15 -40 0 -60" fill="url(#petalGradient)" transform="rotate(45)"/>
    <path d="M0 -60 Q15 -40 0 -20 Q-15 -40 0 -60" fill="url(#petalGradient)" transform="rotate(90)"/>
    <path d="M0 -60 Q15 -40 0 -20 Q-15 -40 0 -60" fill="url(#petalGradient)" transform="rotate(135)"/>
    <path d="M0 -60 Q15 -40 0 -20 Q-15 -40 0 -60" fill="url(#petalGradient)" transform="rotate(180)"/>
    <path d="M0 -60 Q15 -40 0 -20 Q-15 -40 0 -60" fill="url(#petalGradient)" transform="rotate(225)"/>
    <path d="M0 -60 Q15 -40 0 -20 Q-15 -40 0 -60" fill="url(#petalGradient)" transform="rotate(270)"/>
    <path d="M0 -60 Q15 -40 0 -20 Q-15 -40 0 -60" fill="url(#petalGradient)" transform="rotate(315)"/>
  </g>
  
  <!-- Inner petals (8 smaller) -->
  <g transform="translate(90,90)">
    <path d="M0 -40 Q10 -25 0 -12 Q-10 -25 0 -40" fill="url(#petalGradient)" opacity="0.5" transform="rotate(22.5)"/>
    <path d="M0 -40 Q10 -25 0 -12 Q-10 -25 0 -40" fill="url(#petalGradient)" opacity="0.5" transform="rotate(67.5)"/>
    <path d="M0 -40 Q10 -25 0 -12 Q-10 -25 0 -40" fill="url(#petalGradient)" opacity="0.5" transform="rotate(112.5)"/>
    <path d="M0 -40 Q10 -25 0 -12 Q-10 -25 0 -40" fill="url(#petalGradient)" opacity="0.5" transform="rotate(157.5)"/>
    <path d="M0 -40 Q10 -25 0 -12 Q-10 -25 0 -40" fill="url(#petalGradient)" opacity="0.5" transform="rotate(202.5)"/>
    <path d="M0 -40 Q10 -25 0 -12 Q-10 -25 0 -40" fill="url(#petalGradient)" opacity="0.5" transform="rotate(247.5)"/>
    <path d="M0 -40 Q10 -25 0 -12 Q-10 -25 0 -40" fill="url(#petalGradient)" opacity="0.5" transform="rotate(292.5)"/>
    <path d="M0 -40 Q10 -25 0 -12 Q-10 -25 0 -40" fill="url(#petalGradient)" opacity="0.5" transform="rotate(337.5)"/>
  </g>
  
  <!-- Center circle -->
  <circle cx="90" cy="90" r="18" fill="url(#centerGradient)" opacity="0.3"/>
  
  <!-- Decorative dots -->
  <g transform="translate(90,90)">
    <circle cx="0" cy="-45" r="3" fill="#f39c12" opacity="0.6"/>
    <circle cx="32" cy="-32" r="3" fill="#f39c12" opacity="0.6"/>
    <circle cx="45" cy="0" r="3" fill="#f39c12" opacity="0.6"/>
    <circle cx="32" cy="32" r="3" fill="#f39c12" opacity="0.6"/>
    <circle cx="0" cy="45" r="3" fill="#f39c12" opacity="0.6"/>
    <circle cx="-32" cy="32" r="3" fill="#f39c12" opacity="0.6"/>
    <circle cx="-45" cy="0" r="3" fill="#f39c12" opacity="0.6"/>
    <circle cx="-32" cy="-32" r="3" fill="#f39c12" opacity="0.6"/>
  </g>
</svg>